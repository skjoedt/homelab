---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: affine-route
  namespace: affine
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
  hostnames:
    - notes.localho.st
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: affine
          port: 3010
