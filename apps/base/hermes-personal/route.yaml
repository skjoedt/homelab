---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hermes-route
  namespace: hermes-personal
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
  hostnames:
    - hermes.localho.st
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: hermes
          port: 8642
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hermes-dashboard-route
  namespace: hermes-personal
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
  hostnames:
    - hermes-dashboard.localho.st
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: hermes
          port: 9119
