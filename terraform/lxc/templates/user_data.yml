#cloud-config
users:
  - name: skjoedt
    sudo: ALL=(ALL) NOPASSWD:ALL
    groups: users, sudo
    shell: /bin/zsh
    ssh_import_id:
      - gh:skjoedt
    lock_passwd: true

package_update: true
packages:
  - git
  - ntp
  - zsh
  - linux-generic # pulls linux-modules-extra for each kernel update

write_files:
  - path: /etc/modules-load.d/cp210x.conf
    content: |
      cp210x

runcmd:
  - echo 'fs.inotify.max_user_instances=512' >> /etc/sysctl.conf
  - echo 'fs.inotify.max_user_watches=524288' >> /etc/sysctl.conf
  - sysctl -p
